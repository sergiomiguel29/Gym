<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gym System PRO</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
display:flex;
height:100vh;
background:#0b0f0c;
color:white;
}

/* SIDEBAR */
.sidebar{
width:240px;
background:#000;
padding:20px;
border-right:2px solid #0f3d2e;
}

.sidebar h2{
text-align:center;
margin-bottom:20px;
color:#00c853;
}

.sidebar button{
width:100%;
padding:12px;
margin:6px 0;
border:none;
border-radius:8px;
cursor:pointer;
background:#111;
color:white;
font-weight:bold;
transition:0.2s;
border:1px solid #222;
}

.sidebar button:hover{
background:#00c853;
color:black;
transform:scale(1.03);
}

/* CONTENIDO */
.content{
flex:1;
padding:25px;
overflow:auto;
}

/* BOTONES */
.accion{
padding:8px 12px;
border:none;
border-radius:6px;
cursor:pointer;
font-weight:bold;
color:white;
margin:3px;
transition:0.2s;
}

.accion:hover{
transform:scale(1.05);
}

.buscarbtn{background:#1e90ff;}
.mostrarbtn{background:#444;}
.guardar{background:#00c853;color:black;}
.editar{background:#28a745;}
.eliminar{background:#dc3545;}

/* INPUT */
input{
padding:10px;
border-radius:8px;
border:1px solid #333;
background:#111;
color:white;
margin:5px;
}

/* ===== CLIENTES COMO CARDS ===== */
.clientes-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
margin-top:20px;
}

.card{
background:#111;
border:1px solid #1f3d2e;
padding:15px;
border-radius:12px;
transition:0.3s;
position:relative;
overflow:hidden;
}

.card:hover{
transform:translateY(-5px);
border-color:#00c853;
box-shadow:0 0 15px rgba(0,200,83,0.3);
}

.card h3{
color:#00c853;
margin-bottom:10px;
}

.tag{
font-size:12px;
padding:3px 8px;
border-radius:5px;
display:inline-block;
margin-top:5px;
}

.activo{background:#00c853;color:black;}
.moroso{background:#dc3545;}

/* MODAL */
.modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.8);
display:none;
justify-content:center;
align-items:center;
}

.modal-box{
background:#111;
padding:20px;
border-radius:12px;
width:320px;
border:1px solid #333;
}

</style>
</head>

<body>

<div class="sidebar">
<h2>GYM PRO</h2>

<button onclick="dashboard()">Dashboard</button>
<button onclick="clientes()">Clientes</button>
<button onclick="reportes()">Reportes</button>
<button onclick="cerrar()">Cerrar Sesión</button>
</div>

<div class="content" id="contenido">
<h1>Bienvenido</h1>
</div>

<!-- MODAL AGREGAR -->
<div class="modal" id="modalAgregar">
<div class="modal-box">

<h2>Agregar Cliente</h2>

<input type="text" id="nuevoNombre" placeholder="Nombre">
<input type="text" id="nuevoPlan" placeholder="Plan">
<input type="text" id="nuevoEstado" placeholder="Estado">

<br><br>

<button class="accion guardar" onclick="agregarCliente()">Guardar</button>
<button class="accion eliminar" onclick="cerrarAgregar()">Cancelar</button>

</div>
</div>

<!-- MODAL EDITAR -->
<div class="modal" id="modalEditar">
<div class="modal-box">

<h2>Editar Cliente</h2>

<input type="text" id="editNombre" placeholder="Nombre">
<input type="text" id="editPlan" placeholder="Plan">
<input type="text" id="editEstado" placeholder="Estado">

<br><br>

<button class="accion guardar" onclick="guardarEdicion()">Guardar</button>
<button class="accion eliminar" onclick="cerrarModal()">Cancelar</button>

</div>
</div>

<script>

let clientesData = [
{nombre:"Juan Pérez",plan:"Mensual",estado:"Activo"},
{nombre:"María López",plan:"Trimestral",estado:"Activo"},
{nombre:"Carlos Díaz",plan:"Mensual",estado:"Moroso"}
];

let indexEdit = null;

/* CLIENTES UI */
function clientes(){

renderClientes();

document.getElementById("contenido").innerHTML = `
<h1>Clientes</h1>

<input id="buscar" placeholder="Buscar cliente...">

<button class="accion buscarbtn" onclick="buscar()">Buscar</button>
<button class="accion mostrarbtn" onclick="renderClientes()">Mostrar Todos</button>
<button class="accion guardar" onclick="abrirAgregar()">+ Nuevo Cliente</button>

<div class="clientes-grid" id="gridClientes"></div>
`;
renderClientes();
}

/* RENDER CARDS */
function renderClientes(){

setTimeout(()=>{

let grid=document.getElementById("gridClientes");
if(!grid) return;

grid.innerHTML="";

clientesData.forEach((c,i)=>{

grid.innerHTML+=`
<div class="card">
<h3>${c.nombre}</h3>
<p>Plan: ${c.plan}</p>

<span class="tag ${c.estado.toLowerCase()}">${c.estado}</span>

<br><br>

<button class="accion editar" onclick="editar(${i})">Editar</button>
<button class="accion eliminar" onclick="eliminar(${i})">Eliminar</button>
</div>
`;

});

},50);

}

/* BUSCAR */
function buscar(){
let texto=document.getElementById("buscar").value.toLowerCase();

let filtrados=clientesData.filter(c=>c.nombre.toLowerCase().includes(texto));

let grid=document.getElementById("gridClientes");
grid.innerHTML="";

filtrados.forEach((c,i)=>{

grid.innerHTML+=`
<div class="card">
<h3>${c.nombre}</h3>
<p>Plan: ${c.plan}</p>
<span class="tag ${c.estado.toLowerCase()}">${c.estado}</span>
</div>
`;

});

}

/* AGREGAR */
function abrirAgregar(){
document.getElementById("modalAgregar").style.display="flex";
}

function cerrarAgregar(){
document.getElementById("modalAgregar").style.display="none";
}

function agregarCliente(){

clientesData.push({
nombre:document.getElementById("nuevoNombre").value,
plan:document.getElementById("nuevoPlan").value,
estado:document.getElementById("nuevoEstado").value
});

cerrarAgregar();
renderClientes();
}

/* EDITAR */
function editar(i){
indexEdit=i;

document.getElementById("editNombre").value=clientesData[i].nombre;
document.getElementById("editPlan").value=clientesData[i].plan;
document.getElementById("editEstado").value=clientesData[i].estado;

document.getElementById("modalEditar").style.display="flex";
}

function guardarEdicion(){

clientesData[indexEdit]={
nombre:document.getElementById("editNombre").value,
plan:document.getElementById("editPlan").value,
estado:document.getElementById("editEstado").value
};

cerrarModal();
renderClientes();
}

function cerrarModal(){
document.getElementById("modalEditar").style.display="none";
}

/* ELIMINAR */
function eliminar(i){
clientesData.splice(i,1);
renderClientes();
}

/* DASHBOARD */
function dashboard(){
document.getElementById("contenido").innerHTML=`<h1>Dashboard</h1>`;
}

/* REPORTES */
function reportes(){
document.getElementById("contenido").innerHTML=`<h1>Reportes</h1>`;
}

/* CERRAR */
function cerrar(){
window.location.href="login_gimnasio.html";
}

</script>

</body>
</html>
